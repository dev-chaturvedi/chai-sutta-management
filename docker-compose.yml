services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chai_sutta
      POSTGRES_USER: chai
      POSTGRES_PASSWORD: chai_dev_password
    ports:
      - '5432:5432'
    volumes:
      - chai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chai -d chai_sutta"]
      interval: 5s
      retries: 10
volumes:
  chai_postgres:
